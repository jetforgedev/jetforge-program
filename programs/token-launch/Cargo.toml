[package]
name = "token-launch"
version = "0.1.0"
description = "Solana token launch platform with bonding curve"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_launch"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
# Raydium's devnet CPMM program instead of mainnet's.
devnet = []
# Local-validator E2E only: legacy `graduate` admin = the test key in tests/e2e/fixtures.
e2e = []
# Devnet-only test build: graduation at 3 SOL (requires `devnet`; refuses to compile otherwise).
devnet-low-threshold = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }
